[project]
name = "trade-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "ccxt>=4.5.44",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "litellm>=1.82.6",
    "pandas>=3.0.1",
    "pandas-ta-classic>=0.4.47",
    "pmdarima>=2.1.1",
    "pydantic-settings>=2.13.1",
    "python-telegram-bot>=22.7",
    "sqlalchemy[asyncio]>=2.0.48",
    "structlog>=25.5.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.42.0",
    "yfinance>=1.2.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yfinance", "ccxt", "asyncpg", "pandas_ta_classic", "pmdarima"]
ignore_missing_imports = true
