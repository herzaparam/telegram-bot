services:
  db:
    image: timescale/timescaledb:2.18.0-pg16
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: trade_agent
      POSTGRES_USER: trade
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    shm_size: "64mb"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade -d trade_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bot:
    image: ${IMAGE:-ghcr.io/herzaparam/telegram-bot:latest}
    command: uv run python -m src.bot.main
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.25"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8000:8000"

  pipeline:
    image: ${IMAGE:-ghcr.io/herzaparam/telegram-bot:latest}
    command: uv run python -m src.pipeline.main
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: "1.5"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      - PROMETHEUS_PUSHGATEWAY_URL=http://pushgateway:9091
    profiles: ["pipeline"]

  prometheus:
    image: prom/prometheus:v2.53.5
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    depends_on:
      - bot
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_MONITORING_CHAT_ID=${TELEGRAM_MONITORING_CHAT_ID}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    depends_on:
      - prometheus
    restart: unless-stopped

  node_exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - '--path.rootfs=/host'
      - '--web.listen-address=127.0.0.1:9100'
    network_mode: host
    pid: host
    volumes:
      - '/:/host:ro,rslave'
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:v1.11.2
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"
    restart: unless-stopped

volumes:
  pgdata:
  prometheus_data:
