services:
  db:
    image: timescale/timescaledb:2.18.0-pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: trade_agent
      POSTGRES_USER: trade
      POSTGRES_PASSWORD: trade_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: "64mb"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade -d trade_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bot:
    image: ${IMAGE:-ghcr.io/herzaparam/telegram-bot:latest}
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run python -m src.bot.main
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "127.0.0.1:8000:8000"

  pipeline:
    image: ${IMAGE:-ghcr.io/herzaparam/telegram-bot:latest}
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run python -m src.pipeline.main
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    profiles: ["pipeline"]

volumes:
  pgdata:
