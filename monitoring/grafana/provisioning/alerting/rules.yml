apiVersion: 1
groups:
  - orgId: 1
    name: trade-agent-alerts
    folder: Alerts
    interval: 1m
    rules:
      # Alert 1: Pipeline failed to complete (no success in 24h)
      - uid: pipeline-no-success
        title: Pipeline failed to complete
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: prometheus
            model:
              expr: pipeline_last_success_timestamp
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 0
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: Pipeline has not completed successfully in the last 24 hours
        labels:
          severity: critical

      # Alert 2: High CPU usage (>90% for 5min)
      - uid: high-cpu-usage
        title: High CPU usage (>90%)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 90
        for: 5m
        annotations:
          summary: CPU usage is above 90% for 5 minutes
        labels:
          severity: warning

      # Alert 2b: High memory usage (>85%)
      - uid: high-memory-usage
        title: High memory usage (>85%)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 85
        for: 5m
        annotations:
          summary: Memory usage is above 85%
        labels:
          severity: warning

      # Alert 2c: High disk usage (>80%)
      - uid: high-disk-usage
        title: High disk usage (>80%)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 80
        for: 5m
        annotations:
          summary: Disk usage is above 80%
        labels:
          severity: warning

      # Alert 3: Bot service down (up metric missing for 2min)
      - uid: bot-service-down
        title: Bot service is down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="bot"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
        noDataState: Alerting
        for: 2m
        annotations:
          summary: Bot health check has been failing for over 2 minutes
        labels:
          severity: critical

      # Alert 4: Data staleness (no new data in 24h)
      - uid: data-staleness
        title: No new price data in 24 hours
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(data_freshness_hours)
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 24
        noDataState: Alerting
        for: 30m
        annotations:
          summary: No new price data has been ingested for over 24 hours
        labels:
          severity: critical
