name: Build & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - ".planning/**"
      - "*.md"
      - ".claude/**"
      - ".codex/**"

jobs:
  notify-start:
    runs-on: ubuntu-latest
    steps:
      - name: Send start notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_MONITORING_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_MONITORING_BOT_TOKEN }}
          format: markdown
          message: |
            🚀 *Deploy started*
            Repo: `${{ github.repository }}`
            Commit: `${{ github.event.head_commit.message }}`
            By: ${{ github.actor }}

  deploy:
    needs: notify-start
    runs-on: ubuntu-latest

    steps:
      - uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e
            cd ~/telegram-bot
            git fetch origin main
            git reset --hard origin/main
            export IMAGE_TAG
            docker compose -f docker-compose.prod.yml build bot
            docker compose -f docker-compose.prod.yml up -d --force-recreate bot
            docker image prune -f

  notify-result:
    needs: [deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send result notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_MONITORING_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_MONITORING_BOT_TOKEN }}
          format: markdown
          message: |
            ${{ needs.deploy.result == 'success' && '✅ *Deploy successful*' || '❌ *Deploy failed*' }}
            Repo: `${{ github.repository }}`
            Commit: `${{ github.event.head_commit.message }}`
            Deploy: ${{ needs.deploy.result }}
