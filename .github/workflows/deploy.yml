name: Build & Deploy

on:
  push:
    
    paths-ignore:
      - ".planning/**"
      - "*.md"
      - ".claude/**"
      - ".codex/**"

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  notify-start:
    runs-on: ubuntu-latest
    steps:
      - name: Send start notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_MONITORING_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_MONITORING_BOT_TOKEN }}
          format: markdown
          message: |
            🚀 *Deploy started*
            Repo: `${{ github.repository }}`
            Commit: `${{ github.event.head_commit.message }}`
            By: ${{ github.actor }}

  build:
    needs: notify-start
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/trade-agent
            docker pull ${{ env.IMAGE }}:latest
            docker compose -f docker-compose.prod.yml up -d --build --force-recreate bot
            docker image prune -f

  notify-result:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send result notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_MONITORING_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_MONITORING_BOT_TOKEN }}
          format: markdown
          message: |
            ${{ (needs.build.result == 'success' && needs.deploy.result == 'success') && '✅ *Deploy successful*' || '❌ *Deploy failed*' }}
            Repo: `${{ github.repository }}`
            Commit: `${{ github.event.head_commit.message }}`
            Build: ${{ needs.build.result }}
            Deploy: ${{ needs.deploy.result }}
